<dx-tabs
  #withIconAndText
  [width]="'100%'"
  [selectedIndex]="0"
  [showNavButtons]="true"
  [dataSource]="tabs"
  [(selectedIndex)]="selectedIndex"
  (onItemClick)="selectTab($event)"
  [stylingMode]="'primary'"
  [iconPosition]="'start'">
</dx-tabs>

<div class="frame" *ngIf="event">
  <ng-template [ngIf]="selectedTab == 'My Schedule'">
    <app-my-schedule 
      [event]="event" 
      [fullSchedule]="fullSchedule" 
      [activeDay]="activeDay" 
      (navigateToBreakouts)="selectBreakoutTab()"
      [currentUser]="currentUser"
    ></app-my-schedule>
  </ng-template>

  <ng-template [ngIf]="selectedTab == 'Breakout Sessions'">
    <app-breakout-sessions [myCourses]="myCourses" [allCourses]="allCourses" [currentUser]="currentUser" [event]="event"></app-breakout-sessions>
  </ng-template>

</div>

<app-course-modal [allCourses]="allCourses"></app-course-modal>
