<div class="frame" *ngIf="event">
  <div class="card" style="width: 100%;">
    <div class="card-body">
      <h3 class="card-title">Announcements</h3>
      <hr>
      <div *ngFor="let announcement of announcements" class="faq__container">
        <div class="card-text">
          <strong class="faq__question">{{ announcement.title }}</strong>
          <p class="faq__answer" [innerHTML]="announcement.announcement"></p>
        </div>
      </div>
  </div>
</div>
