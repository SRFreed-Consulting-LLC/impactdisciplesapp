<dx-popup
  [showTitle]="true"
  [dragEnabled]="false"
  [visible]="isVisible$ | async"
  height="75%"
  width="30%"
  [showCloseButton]="true"
  (onHiding)="onCancel()">
  <dxi-toolbar-item toolbar="top" location="center">
    <div *dxTemplate>
      <p class="popup-title">
        {{ series?.id ? 'EDIT' : 'ADD' }} SERIES
      </p>
    </div>
  </dxi-toolbar-item>
  <div *dxTemplate="let data of 'content'">
    <div class="add-item-modal">
      <div class="add-item-modal__content" *ngIf="isVisible$ | async">
        <dx-form
          #addEditForm
          [(formData)]="series"
          [showColonAfterLabel]="false"
          labelLocation="left"
          [colCount]="5">
          <dxi-item dataField="title" [colSpan]="4" [isRequired]="true"></dxi-item>
        </dx-form>
      </div>
      <div class="row" style="padding-top: 10px; padding-bottom: 5px;">
        <div class="col-9"><h4>Books in Series</h4></div>
        <div class="col-3">
          <dx-button
            style="position: absolute; right: 15px;"
            text="Add Book"
            stylingMode="contained"
            type="normal"
            [disabled]="inProgress$ | async"
            (onClick)="showEditModal()">
          </dx-button>
        </div>
      </div>
      <div>
        <dx-data-grid class="dx-card wide-card"
          #grid
          [dataSource]="datasource$ | async"
          [height]="'50vh'"
          [showBorders]="false"
          [showColumnLines]="true"
          [showColumnLines]="true"
          [showRowLines]="true"
          [focusedRowEnabled]="true"
          [columnAutoWidth]="true"
          (onRowDblClick)="showEditModal($event)">

          <dxo-scrolling mode="virtual"></dxo-scrolling>
          <dxo-filter-row [visible]="true"></dxo-filter-row>
          <dxi-column dataField="title"></dxi-column>

          <dxi-column type="buttons" caption="Actions" [allowReordering]="false">
            <dxi-button icon="trash" hint="DELETE" [onClick]="deleteBook"></dxi-button>
          </dxi-column>

        </dx-data-grid>
      </div>
      <div class="add-item-modal__button-group" style="position: absolute; right: 15px; bottom: 10px;">
        <dx-button
          width="150px"
          style="margin-right: 10px;"
          text="CANCEL"
          stylingMode="contained"
          type="normal"
          [disabled]="inProgress$ | async"
          (onClick)="onCancel()">
        </dx-button>
        <dx-button
          width="150px"
          text="SAVE"
          stylingMode="contained"
          type="normal"
          [disabled]="inProgress$ | async"
          (onClick)="onSave(series)">
        </dx-button>
      </div>
    </div>
  </div>
</dx-popup>
